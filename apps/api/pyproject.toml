[project]
name = "devboard-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.8,<3", "httpx>=0.28,<1"]

[dependency-groups]
dev = ["mypy>=2.3,<3", "pre-commit>=4,<5", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
